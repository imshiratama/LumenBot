[project]
name = "telegram-guard-vercel"
version = "1.0.0"
requires-python = "==3.12.*"
dependencies = [
  "python-telegram-bot==20.8",
  "httpx>=0.26,<0.27",
  "fastapi>=0.115,<1.0",
  "upstash-redis>=1.8,<2.0",
  "qstash>=3.4,<4.0",
  "python-dotenv>=1.0,<2.0",
  "uvicorn>=0.30,<1.0",
]

[tool.vercel]
entrypoint = "main:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
